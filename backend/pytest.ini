[pytest]
# pytest.ini — CodeLens Test Suite Configuration
# ================================================
# Run from /backend/:
#   pytest                        # all tests
#   pytest -v                     # verbose
#   pytest tests/test_encryption.py -v
#   pytest -k "test_sql"          # filter by name
#   pytest --cov=. --cov-report=html   # with coverage

DJANGO_SETTINGS_MODULE = config.settings

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --tb=short
    --strict-markers
    -q

# Custom markers
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks integration tests that hit the real DB
    unit: marks pure unit tests with no I/O
