<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background square -->
  <rect width="120" height="120" rx="16" fill="#0a0b0e"/>
  <!-- Amber accent ring -->
  <circle cx="60" cy="60" r="36" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 4" opacity="0.5"/>
  <!-- Lens / magnifier circle -->
  <circle cx="54" cy="54" r="22" stroke="#f59e0b" stroke-width="4"/>
  <!-- Cross-hair lines inside lens -->
  <line x1="54" y1="38" x2="54" y2="70" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <line x1="38" y1="54" x2="70" y2="54" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
  <!-- Magnifier handle -->
  <line x1="70" y1="70" x2="86" y2="86" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <!-- Small vulnerability dot indicator -->
  <circle cx="62" cy="46" r="4" fill="#ef4444"/>
  <!-- CL text -->
  <text x="60" y="104" font-family="monospace" font-size="11" font-weight="700"
        fill="#f59e0b" text-anchor="middle" letter-spacing="3">CODELENS</text>
</svg>
