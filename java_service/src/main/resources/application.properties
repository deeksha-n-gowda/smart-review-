# CodeLens Java Compiler Service — Configuration
# ================================================
# These properties are read at startup. Override with environment variables.
#
# In Docker: set JAVA_SERVICE_PORT as an env var in docker-compose.yml
# On Windows: set JAVA_SERVICE_PORT=9090 before running the JAR

# Port the HTTP server listens on (also configurable via CLI arg)
service.port=9090

# Maximum source code size accepted per request (bytes)
service.max_source_bytes=524288

# Default compilation timeout (ms)
service.default_timeout_ms=5000

# Log level: FINEST | FINER | FINE | CONFIG | INFO | WARNING | SEVERE
service.log_level=INFO
